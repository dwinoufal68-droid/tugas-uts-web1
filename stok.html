<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Katalog Buku | BookStore</title><link rel="stylesheet" href="style.css"></head>
<body><header class="topbar"><a class="brand" href="dashboard.html"><span class="brand-mark">B</span> BookStore</a><nav><a href="dashboard.html">Dashboard</a><a class="active" href="stok.html">Katalog</a><a href="checkout.html">Pemesanan</a><a href="tracking.html">Pengiriman</a></nav><a class="btn outline small" href="login.html">Keluar</a></header>
<main class="container"><div class="page-heading"><div><p class="eyebrow">INVENTARIS</p><h1>Informasi Stok & Katalog</h1><p class="muted">Data buku dimuat dari variabel dataKatalogBuku di data.js.</p></div><button class="btn primary" id="openBookForm">＋ Tambah Buku</button></div>
<div class="toolbar"><input id="searchBook" type="search" placeholder="Cari kode atau nama buku..."><select id="categoryFilter"><option value="">Semua jenis</option><option value="Buku Ajar">Buku Ajar</option></select></div>
<div class="table-wrap"><table><thead><tr><th>No</th><th>Kode</th><th>Nama Buku</th><th>Jenis</th><th>Edisi</th><th>Harga</th><th>Stok</th><th>Aksi</th></tr></thead><tbody id="bookTableBody"></tbody></table></div><p id="emptyBooks" class="empty-state hidden">Buku tidak ditemukan.</p></main>
<dialog id="bookModal" class="modal"><form id="bookForm" class="modal-content"><button class="close-btn" type="button" id="closeBookModal">×</button><h2>Tambah Buku</h2><label for="bookCode">Kode barang</label><input id="bookCode" required><label for="bookTitle">Nama buku</label><input id="bookTitle" required><label for="bookType">Jenis barang</label><input id="bookType" value="Buku Ajar" required><label for="bookEdition">Edisi</label><input id="bookEdition" type="number" min="1" value="1" required><label for="bookPrice">Harga (angka)</label><input id="bookPrice" type="number" min="1" required><label for="bookStock">Stok</label><input id="bookStock" type="number" min="0" required><button class="btn primary" type="submit">Simpan Buku</button></form></dialog>
<script src="data.js"></script><script src="script.js"></script></body></html>
